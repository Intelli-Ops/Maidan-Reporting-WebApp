<!--
  Maidan tab icon.

  The wordmark is a wide 2.16:1 lockup in black on transparent, so it cannot be
  the favicon on its own: a bare wordmark gets letterboxed into a sliver in a
  square tab slot, and black-on-transparent vanishes entirely against a
  dark-mode tab strip. Both problems are solved the same way the app itself
  solves them — Sidebar and BrandPanel always seat this logo on the pale mint
  pill, so the pill is reused here rather than invented for the icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAF9"/>
      <stop offset="1" stop-color="#E7F2ED"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#pill)"/>
  <!-- The app draws this edge in white/70 because it sits on a coloured panel.
       A tab strip can be white, so the icon needs an edge that is darker than
       the pill instead, or it dissolves into the browser chrome. -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#D3E4DB" stroke-width="1.5"/>
  <image
    x="6" y="19.94" width="52" height="24.12"
    href="data:image/png;base64,"/>
</svg>
